name: ci-ts

on:
  push:
    branches: [main]
    paths:
      - "packages/ts/**"
      - "fixtures-shared/**"
      - ".github/workflows/ci-ts.yml"
  pull_request:
    paths:
      - "packages/ts/**"
      - "fixtures-shared/**"
      - ".github/workflows/ci-ts.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Current lines that received the October 2026 security release.
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # The 2026-10-22 ubuntu-latest toolcache still has 22.23.3 and 24.21.0.
          # check-latest reads nodejs.org/dist and installs 22.23.4 / 24.22.1.
          check-latest: true
          cache: pnpm
          cache-dependency-path: packages/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: audit (high+)
        run: pnpm audit --audit-level=high --prod

name: publish-pypi

on:
  push:
    tags:
      - "py-v*"

jobs:
  publish:
    # PyPI Trusted Publishing via GitHub OIDC is expected to work on
    # self-hosted runners (pypa/gh-action-pypi-publish README). Tag-gated
    # only (py-v*) — merge of a CI PR does not publish.
    # npm Trusted Publishing still requires a GitHub-hosted runner; see
    # publish-npm.yml (docs.npmjs.com/trusted-publishers).
    runs-on: [self-hosted, Linux, X64, ci-general]
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing via OIDC
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[dev]"
      - run: pytest -v
      - run: uv pip install --system build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/

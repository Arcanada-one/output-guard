name: ci-python

on:
  push:
    branches: [main]
    paths:
      - "packages/python/**"
      - "fixtures-shared/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    paths:
      - "packages/python/**"
      - "fixtures-shared/**"
      - ".github/workflows/ci-python.yml"

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, ci-general]
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Self-hosted runners retain site-packages across jobs. Use an ephemeral
      # venv so pip-audit cannot see unrelated packages from other workflows.
      - name: Create isolated venv
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/og-venv"
          echo "${RUNNER_TEMP}/og-venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip setuptools "wheel>=0.46.2"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -v
      # pip-audit: not --strict (own package not yet on PyPI; strict-mode errors on un-auditable local install).
      # CVE-2026-3219 (pip) has no fix as of 2026-05-12 — ignore with revisit 2026-08-12 per Arcanada quarterly audit cadence.
      # Once arcanada-output-guard is published, restore --strict.
      - run: python -m pip install pip-audit
      - run: pip-audit --ignore-vuln CVE-2026-3219

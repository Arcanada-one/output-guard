name: publish-npm

# Operator decision 2026-11-18: publish from our self-hosted runners with an
# npm automation token (GitHub Actions secret NPM_TOKEN). npm Trusted
# Publishing / OIDC is accepted only from GitHub-hosted runners, so this
# workflow no longer uses ubuntu-latest, id-token: write, or --provenance
# (provenance attestations are not supported off GitHub-hosted).

on:
  push:
    tags:
      - "ts-v*"
  pull_request:
    paths:
      - "packages/ts/**"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag to publish from (e.g. ts-v0.1.6)"
        required: true

jobs:
  # Build + test + dry-run without NPM_TOKEN. Safe for pull_request CI.
  build:
    # Datarim fork deny: refuse untrusted fork PR code on org self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci-general]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      # Prevent concurrent jobs from reading a partially written shared pnpm setup.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: packages/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Publish dry-run (no secret)
        run: pnpm publish --dry-run --no-git-checks --access public

  publish:
    needs: build
    # Tag push, or workflow_dispatch from main only — never pull_request.
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ts-v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, ci-general]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      # Prevent concurrent jobs from reading a partially written shared pnpm setup.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: packages/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # NODE_AUTH_TOKEN via setup-node registry-url .npmrc; no --provenance off GH-hosted.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks
